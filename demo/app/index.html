<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android app on WebAssembly</title>
<style>
  :root { --bg: #0e1016; --fg: #d7dbe5; --muted: #8a90a0; --ok: #6fd28a; --bad: #ff7b72; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f6f7f9; --fg: #1d2030; --muted: #5a6072; --ok: #1a7f37; --bad: #cf222e; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  canvas { display: block; width: 100%; max-width: 640px; aspect-ratio: 4 / 3;
           background: #000; border-radius: 6px; touch-action: none; outline: none; }
  /* The navigation bar of a phone (topic userspace): Back, Home, Recents as
     Android key codes 4, 3, 187 ("Android:N" codes for browser_input). */
  nav { display: flex; max-width: 640px; margin-top: 6px; background: #000; border-radius: 6px; }
  nav button { flex: 1; height: 44px; border: 0; background: none; color: #d7dbe5;
               font-size: 20px; line-height: 1; cursor: pointer; touch-action: manipulation; }
  nav button:active { background: #ffffff1f; }
  nav button:focus-visible { outline: 2px solid #8ab4f8; outline-offset: -2px; }
  pre { margin: 8px 0 0; font: 12px/1.45 ui-monospace, monospace;
        white-space: pre-wrap; word-break: break-word; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .log { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header id="cmd"></header>
  <!-- An Android app launched the way a launcher does it: the in-process
       system_server (arcwasm.server.SystemServer) starts the package's
       launcher Activity; its window is composited onto this canvas, and
       pointer/keyboard events go to it through its InputChannel. -->
  <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
  <nav aria-label="Android navigation">
    <button data-key="4" aria-label="Back" title="Back">&#9665;</button>
    <button data-key="3" aria-label="Home" title="Home">&#9675;</button>
    <button data-key="187" aria-label="Recent apps" title="Recent apps">&#9633;</button>
  </nav>
  <pre id="out"></pre>
</main>
<script src="report.js"></script>
<script>
  // ?pkg=PACKAGE (default: the test APK, org.arcwasm.testapp; com.android.launcher
  // for the stock home screen) or
  // ?pkg=PACKAGE/.Activity; ?selftest=1 taps the button three times with
  // synthetic DOM events and checks that MainActivity counted them.
  var params = new URLSearchParams(location.search);
  var selfTest = params.get('selftest') === '1';
  var args = ['arcwasm.server.SystemServer', params.get('pkg') || 'org.arcwasm.testapp'];
  // ?systemui=1: SystemUI's status bar too (SystemServer --systemui, topic userspace)
  if (params.get('systemui') === '1') args.splice(1, 0, '--systemui');
  document.getElementById('cmd').textContent = 'dalvikvm ' + args.join(' ');
  var canvas = document.getElementById('canvas');
  // Navigation buttons: key down on press, up on release (a long press stays
  // a long press), sent through the canvas's keyboard path as "Android:N".
  document.querySelectorAll('nav button').forEach(function (b) {
    var code = 'Android:' + b.dataset.key, down = false;
    function send(type) {
      canvas.dispatchEvent(new KeyboardEvent(type, { code: code, key: code, bubbles: true }));
    }
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); down = true; send('keydown'); });
    function up() { if (down) { down = false; send('keyup'); } }
    b.addEventListener('pointerup', up);
    b.addEventListener('pointerleave', up);
    b.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && !down) { e.preventDefault(); down = true; send('keydown'); }
    });
    b.addEventListener('keyup', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); up(); }
    });
  });
  var outEl = document.getElementById('out');
  var started = performance.now();
  var done = false;
  function emit(text) {
    var line = document.createElement('span');
    if (/^AppSelfTest: .*passed/.test(text)) line.className = 'ok';
    else if (/^AppSelfTest: .*failed|Exception|Error|Abort/.test(text)) line.className = 'bad';
    else if (/^[VDIWEF]\//.test(text)) line.className = 'log';
    line.textContent = text + '\n';
    outEl.appendChild(line);
    while (outEl.childNodes.length > 40) outEl.removeChild(outEl.firstChild);
    arcReport(text);
    var ready = /MainActivity: ready button=(\d+),(\d+)/.exec(text);
    if (ready) {
      emit('AppSelfTest: MainActivity on screen after ' +
           Math.round(performance.now() - started) + ' ms');
      if (selfTest) setTimeout(function () { tap3(+ready[1], +ready[2]); }, 200);
    }
    var clicks = /MainActivity: clicks=(\d+)/.exec(text);
    if (selfTest && clicks && +clicks[1] === 3 && !done) {
      done = true;
      emit('AppSelfTest: 3 taps -> 3 clicks, passed (' +
           Math.round(performance.now() - started) + ' ms)');
    }
  }
  // Taps at display coordinates (bx, by), mapped to client coordinates the
  // way the page shows the canvas.
  function tap3(bx, by) {
    var rect = canvas.getBoundingClientRect();
    function pointer(type) {
      var init = { bubbles: true, cancelable: true, pointerId: 1, pointerType: 'mouse',
                   isPrimary: true,
                   clientX: rect.left + bx * rect.width / canvas.width,
                   clientY: rect.top + by * rect.height / canvas.height,
                   pressure: type === 'pointerup' ? 0 : 0.5,
                   buttons: type === 'pointerup' ? 0 : 1 };
      var e = typeof PointerEvent === 'function' ? new PointerEvent(type, init)
                                                 : new MouseEvent(type, init);
      if (e.pointerId === undefined) {
        Object.defineProperty(e, 'pointerId', { value: 1 });
        Object.defineProperty(e, 'pointerType', { value: 'mouse' });
        Object.defineProperty(e, 'pressure', { value: init.pressure });
      }
      canvas.dispatchEvent(e);
    }
    var k = 0;
    (function next() {
      if (k >= 6) return;
      pointer(k % 2 ? 'pointerup' : 'pointerdown');
      k++;
      setTimeout(next, 80);
    })();
    setTimeout(function () {
      if (!done) { done = true; emit('AppSelfTest: no 3 clicks within 10 s, failed'); }
    }, 10000);
  }
  var Module = {
    arguments: args,
    canvas: canvas,
    print: emit,
    printErr: emit,
    onExit: function (code) { emit('EXIT ' + code); document.title = 'EXIT ' + code; },
    onAbort: function (what) { emit('ABORT ' + what); },
  };
</script>
<script src="dalvikvm.js"></script>
<script>
  // Frames per second on the canvas, every 2 s (also reaches tools/serve.py's
  // log, which is how runs in Safari are checked).
  var lastFrames = 0;
  setInterval(function () {
    if (!Module._arcwasm_display_frames) return;
    var n = Module._arcwasm_display_frames();
    emit('AppStats: frames=' + n + ' fps=' + ((n - lastFrames) / 2).toFixed(1) +
         ' visible=' + (document.visibilityState === 'visible'));
    lastFrames = n;
  }, 2000);
</script>
</body>
</html>
