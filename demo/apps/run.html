<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>SENSES Web Apps</title>
<link rel="stylesheet" href="senses.css">
<style>
  /* SENSES Web Apps: one installed app on its system, full screen (topic
     senses-shell, docs/topics/senses-shell.md, "Running"). Android's display
     and SENSES's key panel under it, as the Web Systems PWA and SENSES lay
     them out (KeyPanel.plan). */
  html, body { height: 100%; overflow: hidden; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #screen { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; overflow: hidden; background: #000; }
  #phone { display: flex; flex-direction: column; flex: none; }
  canvas { display: block; background: #000; touch-action: none; outline: none; }
  /* SENSES's key panel (art/KeyPanel.kt): 72 units high for 511 of width;
     "back" and "home" outlined in grey, the SENSES plate between them, the
     status line in the strip between the frame and the keys. */
  #panel { position: relative; flex: none; background: #000; touch-action: none;
           -webkit-tap-highlight-color: transparent; }
  #panel svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #mem { position: absolute; left: 0; right: 0; top: 0; text-align: center; color: #6f6f6f;
         white-space: nowrap; overflow: hidden; pointer-events: none; font-variant-numeric: tabular-nums; }

  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             padding: 24px; background: #000; z-index: 5; }
  #overlay[hidden] { display: none; }
  .card { width: 100%; max-width: 340px; text-align: center; }
  .card img { width: 84px; height: 84px; border-radius: 20px; background: #1a1a1a; }
  .card h1 { margin: 14px 0 2px; font-size: 21px; font-weight: 600; }
  .card .os { color: var(--muted); font-size: 14px; margin: 0 0 14px; }
  #status { margin: 10px 0 0; min-height: 1.45em; }
  #hint { margin: 4px 0 0; color: var(--muted); font-size: 13px; min-height: 1.3em; overflow-wrap: anywhere; }
  .error { color: var(--bad) !important; }
  .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
  .actions button { height: 46px; border: 0; border-radius: 12px; background: var(--btn); }
  .actions button[hidden] { display: none; }
  .actions button.primary { background: #e3e3e3; color: #000; }
  #stopping { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              background: #000c; color: #d0d0d0; font-size: 17px; z-index: 30; }
  #stopping[hidden] { display: none; }
  /* Over the running app: a file did not get space (storage budget). */
  #notice { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 12px); z-index: 20;
            max-width: 420px; margin: 0 auto; padding: 12px 14px; border-radius: 12px; background: #2b1717ee;
            color: #f0d6d6; font-size: 14px; line-height: 1.35; }
  #notice b { display: block; font-size: 15px; margin-bottom: 2px; }
  #notice[hidden] { display: none; }
  /* Over the running app: memory runs low (the memory budget, threads on an iPhone). */
  #memwarn { position: fixed; left: 12px; right: 12px; top: calc(env(safe-area-inset-top) + 12px); z-index: 21;
             max-width: 420px; margin: 0 auto; padding: 12px 14px; border-radius: 12px; background: #2b2417f2;
             color: #f0e6d0; font-size: 14px; line-height: 1.35; }
  #memwarn b { display: block; font-size: 15px; margin-bottom: 2px; }
  #memwarn .row { display: flex; gap: 8px; margin-top: 10px; }
  #memwarn button { flex: 1; padding: 9px 0; border: 0; border-radius: 9px; font: inherit; font-weight: 600;
                    background: #f0e6d0; color: #2b2417; }
  #memwarn button.later { background: transparent; color: #f0e6d0; border: 1px solid #f0e6d066; font-weight: 400; }
  #memwarn button.test { display: block; width: 100%; margin-top: 8px; padding: 4px 0; background: transparent;
                         color: #f0e6d0; font-weight: 400; text-decoration: underline; }
  #memwarn button[hidden], #memwarn[hidden] { display: none; }
  /* Memory in use, always over the app (taps go through). */
  #ram { position: fixed; right: 8px; bottom: calc(env(safe-area-inset-bottom) + 8px); z-index: 15;
         padding: 3px 8px; border-radius: 9px; background: #000a; color: #e8e8e8; font-size: 11.5px;
         font-variant-numeric: tabular-nums; pointer-events: none; }
  #ram.warn { background: #6b4a10e0; }
  #ram[hidden] { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <div id="phone">
      <!-- Android's display: the VM takes this canvas over with the size it
           has at startup, so the page sets it before loading the system. -->
      <canvas id="canvas" width="360" height="640" tabindex="0"></canvas>
      <div id="panel">
        <svg viewBox="0 0 511 72" preserveAspectRatio="none" aria-hidden="true">
          <g fill="none" stroke="#969696" stroke-width="2.9" stroke-linecap="butt" stroke-linejoin="miter">
            <polyline points="106.1,21.3 92.9,32 106.1,42.7"/>
            <polygon points="398.6,41.7 398.6,29.6 407.23,22.6 415.85,29.6 415.85,41.7"/>
          </g>
          <!-- SENSES: placed by KeyPanel.logoBox. -->
          <svg x="190.65" y="14.15" width="126.9" height="35.44" viewBox="612.487 387.966 30.4297 8.5"
               preserveAspectRatio="none">
            <defs>
              <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="627.699" y1="388.132"
                              x2="627.699" y2="396.504"
                              gradientTransform="matrix(0.696811 -0.717255 3.030674 2.944293 -996.241235 -312.990331)">
                <stop offset="0" stop-color="#141414"/>
                <stop offset="0.44" stop-color="#d3d1d1"/>
                <stop offset="1" stop-color="#141414"/>
              </linearGradient>
              <mask id="ink" style="mask-type: alpha" maskUnits="userSpaceOnUse"
                    x="612.487" y="387.966" width="30.4297" height="8.5">
                <image href="senses-mask.png" x="612.487" y="387.966" width="30.4297" height="8.5"
                       preserveAspectRatio="none"/>
              </mask>
            </defs>
            <rect x="612.487" y="387.966" width="30.4297" height="8.5" fill="url(#shine)" mask="url(#ink)"/>
          </svg>
          <rect id="glow" rx="16" fill="#ffffff" fill-opacity="0.12" visibility="hidden"/>
        </svg>
        <div id="mem"></div>
      </div>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <img id="icon" src="icon-192.png" alt="">
    <h1 id="title">SENSES Web Apps</h1>
    <p class="os" id="os"></p>
    <div class="bar" id="bar"><div></div></div>
    <p id="status"></p>
    <p id="hint"></p>
    <div class="actions">
      <button id="retry" class="primary" hidden>Попробовать снова</button>
      <button id="library" hidden>В библиотеку</button>
      <button id="showlog" hidden>Журнал</button>
    </div>
  </div>
</div>

<!-- The SENSES plate's menu. -->
<div id="menu" class="sheet" hidden>
  <div class="box">
    <svg class="sheetlogo" viewBox="612.487 387.966 30.4297 8.5" aria-label="SENSES">
      <rect x="612.487" y="387.966" width="30.4297" height="8.5" fill="url(#shine)" mask="url(#ink)"/>
    </svg>
    <button id="mlibrary">В библиотеку</button>
    <button id="mrestart">Перезапустить приложение</button>
    <button id="mlog">Журнал</button>
    <button class="close" data-close>Закрыть</button>
  </div>
</div>
<div id="stopping" hidden>Приложение закрывается…</div>
<div id="notice" hidden><b>Хранилище заполнено</b><span id="noticetext"></span></div>
<div id="ram" hidden></div>
<div id="memwarn" hidden><b id="memtitle">Мало памяти</b><span id="memtext"></span>
  <div class="row"><button id="memreload">Перезагрузить</button><button id="memlater" class="later">Позже</button></div>
  <button id="memtest" class="test" hidden>Узнать, сколько памяти даёт это устройство (тест, 2 мин)</button>
</div>
<div id="logbox" hidden>
  <div id="logbar"><button id="logback">&#8249; Назад</button><span>Журнал</span></div>
  <pre id="log"></pre>
</div>

<script src="report.js"></script>
<script src="mem_plan.js"></script>
<script src="store.js"></script>
<script src="origins.js"></script>
<script src="senses.js"></script>
<script>
(function () {
  'use strict';
  // run.html?pkg=PACKAGE: the app from the library (senses/apps/PACKAGE,
  // its system from meta.json). ?stack=a10|a81|a60|a44 overrides it, and with
  // it an app of the system's own image runs without being installed
  // (build/extra-apks8: Firefox). Test switches as the Web Systems PWA:
  // ?canvas2d=1 (display without WebGL in workers, as iOS 16), ?memdata=1
  // (/data and the library in IndexedDB, as iOS 16.1), ?remotegl=1, ?log=1,
  // ?run=1 (start in a browser tab on a phone), ?memrefuse=S (the device's
  // memory refused for S seconds, as right after another app on an iPhone),
  // ?jit=0|1 over the app's meta.jit (JIT on unless false: ENV.ARC_JIT,
  // the VM's ro.arcwasm.jit; docs/topics/guest-jit.md), ?net=0|1 over
  // meta.net (the app's network: ENV.ARC_NET, which the VM's kernel applies;
  // docs/topics/app-network.md), ?gms=0|1 over meta.gms (Google's services
  // the user added for the system: ENV.ARC_GMS, the VM's ro.arcwasm.gms;
  // docs/topics/gms.md), ?landscape=1 (a
  // landscape display from the start, see "layout"), &tap=X,Y@S (repeatable) a
  // touch at X,Y of the display (pixels, or N% of its width and height) S
  // seconds after the app shows (phones nobody holds, as the VM test page),
  // ?storage=skip (start whatever the free space: it is still measured for
  // the VM's storage budget), ?freespace=1 (free all that comes back by itself
  // first), ?opfsfree=MB|off (that budget instead of the measured one, or none),
  // ?opfstrace=1 (the VM's OPFS thread logs its start step by step) and
  // ?opfsgrow=MB (it writes a file of MB megabytes first, as an app that
  // writes much; shim/opfs/library_arc_opfs.js).
  // On an app's own origin (topic per-app-origin, origins.js) the library
  // says ?home=LIBRARY (kept: the way back, with the memory and space this
  // page saw), ?appstack=, ?jit= and ?net= (the system, JIT and
  // network chosen there) and
  // ?memlimit= (its memory test's result).
  var S = Senses, $ = S.$, params = new URLSearchParams(location.search);
  var pkg = params.get('pkg') || '';
  var home = './';
  if (params.get('memlimit')) {
    try { JSON.parse(params.get('memlimit')); localStorage.setItem('senses-mem-limit', params.get('memlimit')); } catch (e) {}
  }
  var canvas = $('canvas');

  // The systems' files (mk/topic-senses-apps.mk) and command lines, as the
  // VM side wants them (topic install8, docs/topics/install8.md "Contract
  // with the shell"): SystemServer --senses PACKAGE runs the one app from the
  // library (read-only /mnt/apps, ENV.ARC_APPS_DIR) without launcher or
  // SystemUI, on the stack's own /data (ENV.ARC_DATA_DIR), and says what
  // happens on stdout ("SENSES: app shown|exit|crash|missing ..."). 4.4 takes
  // the display's size on the command line; 6.0, 8.1 and 10 take the canvas's.
  // touched: the system's memory monitor tells the wasm memory it touched
  // (MemoryBudget.touched): its memory can be made whole at once (see "memory").
  var SYSTEMS = {
    a10: {script: 'a10/artvm10.js', vm: 'art10', touched: true,
          args: function (p) { return ['arcwasm.server.SystemServer', '--senses', p]; }},
    a81: {script: 'a81/artvm8.js', vm: 'art8', touched: true,
          args: function (p) { return ['arcwasm.server.SystemServer', '--senses', p]; }},
    a60: {script: 'a60/artvm.js', vm: 'art',
          args: function (p) { return ['arcwasm.server.SystemServer', '--senses', p]; }},
    a44: {script: 'a44/dalvikvm.js', vm: 'dalvik',
          args: function (p) {
            return ['arcwasm.server.SystemServer', '--display', canvas.width + 'x' + canvas.height + '@160',
                    '--senses', p];
          }},
  };
  // Dalvik's heap limit by the wasm memory this device allowed (its own
  // default is 16 MB for everything); ART sizes its heap by the memory
  // budget itself.
  var HEAPS = {dalvik: [[1536, 256], [1024, 192], [768, 128], [0, 64]]};
  function heapFor(vm, maxBytes) {
    var steps = HEAPS[vm], mb = maxBytes / 1048576;
    if (!steps) return null;
    for (var i = 0; i < steps.length; i++) if (mb >= steps[i][0]) return '-Xmx' + steps[i][1] + 'm';
  }

  // --- overlay ---------------------------------------------------------------
  function status(text, fraction, hint) {
    $('overlay').hidden = false;
    $('status').textContent = text;
    $('status').classList.remove('error');
    S.bar($('bar'), fraction);
    $('hint').textContent = hint || '';
  }
  var failed = false;
  function fail(text, hint) {
    if (failed) return;
    failed = true;
    S.log('Run: failed: ' + text + (hint ? ' (' + hint + ')' : ''));
    $('overlay').hidden = false;
    $('status').textContent = text;
    $('status').classList.add('error');
    $('bar').hidden = true;
    $('hint').textContent = hint || '';
    $('retry').hidden = false;
    $('library').hidden = false;
    $('showlog').hidden = false;
  }
  var retryUrl = '';  // where "try again" goes (storage: the start without the space check)
  $('retry').onclick = function () { if (retryUrl) replacePage(retryUrl); else reloadPage(); };
  $('library').onclick = function () { toLibrary(false); };
  $('showlog').onclick = S.showLog;
  if (params.get('log') === '1') S.showLog();

  // Back to the library: Android first gets HOME (the app stops and its
  // task is saved: "SENSES: app exit PKG home", then the page goes, or after
  // HOME_WAIT_MS at most); one VM per page, gone with it.
  var leaving = false, HOME_WAIT_MS = 3000;
  function toLibrary(home) {
    if (leaving) return;
    leaving = true;
    $('stopping').hidden = false;
    if (home && running) tapKey(3);
    setTimeout(leaveNow, home && running ? HOME_WAIT_MS : 400);
  }
  // (memtestNext: the library goes on to its memory test, see "low memory")
  var memtestNext = false;
  function leaveNow() {
    var q = backParams();
    if (memtestNext) q.set('memtest', pkg);
    ['canvas2d', 'memdata', 'remotegl', 'run'].forEach(function (k) { if (params.get(k)) q.set(k, params.get(k)); });
    // (the reopen test: index.html's ?open=PKG&loops=N&leaveafter=S)
    if (+params.get('loops') > 0) {
      q.set('open', pkg); q.set('loops', params.get('loops')); q.set('leaveafter', params.get('leaveafter'));
    }
    replacePage(home + (String(q) ? '?' + q : ''));
  }
  // To a library of another origin: what it shows on the app's tile and card
  // (index.html fromApp).
  var lastStorage = null;
  function backParams() {
    var q = new URLSearchParams();
    if (home === './') return q;
    q.set('from', pkg);
    if (ramPeak) q.set('ram', String(ramPeak));
    if (lastStorage) {
      q.set('used', String(Math.round(lastStorage.usage)));
      q.set('quota', String(Math.round(lastStorage.quota)));
      if (lastStorage.guessed) q.set('guessed', '1');
    }
    return q;
  }

  // --- memory ----------------------------------------------------------------
  // A VM's wasm memory is shared memory, made whole at once: its initial part
  // (256 MB ART, 512 MB Dalvik) and its maximum as reserved address space.
  // Right after the previous app's page (iPhones: run.html left a moment ago)
  // iOS has not given that page's memory back yet and refuses even 512 MB
  // ("RangeError: Out of memory"), for seconds, at times tens of seconds
  // (iPhone X, iOS 16.1: four and five failed starts in a row at 2 s apart).
  // So the page makes the memory before it loads the VM: the build's
  // ceiling or a smaller one, and when none is given it waits (1, 2, 3, 4,
  // then 5 s at a time, up to MEMORY_WAIT_MS) and tries again, without
  // reloading. The memory got goes to the VM: fit_memory.js asks
  // WebAssembly.Memory for its memory, and the wrapper here answers with
  // this one. Out of memory later, while the system starts: the page reloads
  // after a pause with a lower ceiling (?memtry=2: 1 GB, ?memtry=3: 768 MB;
  // not ?mem=, which the VM's memory budget takes for megabytes:
  // shim/membudget/mem_budget_pre.js); past that, or once the app is on
  // screen, the error.
  // On an iPhone every page memory.grow adds is in the tab's footprint at
  // once, touched or not, while the pages a memory is made with count only
  // once touched (iPhone X, iOS 16.7, topic senses-shell-fixes: made with 16
  // MB and grown to 512 untouched, 513 MB; made with 1536, 16 MB, and 529 once
  // 512 MB are written). So a VM whose monitor tells what it touched (see
  // "low memory") gets its memory whole at once there: the ceiling as its
  // initial size, nothing ever grown; refused that, as before.
  var MEMORY_WAIT_MS = 60000, PAGE = 65536;
  var memTry = Math.max(1, Math.min(3, +params.get('memtry') || 1));
  var CAPS = [0, 16384, 12288, 8192];  // pages; 0: the plan's ceiling (see makeMemory)
  var RealMemory = WebAssembly.Memory, handed = null;
  var madeMb = 0;  // the size the VM's memory was made with (MB), when it took the one made here
  // The VM asking for other sizes than the memory made here would make a
  // second one beside it: two reservations of 1.5 GB do not fit iOS's
  // Gigacage (~1.87 GB), and the second is refused or smaller. Said in the
  // log either way; a memory that did not fit is let go.
  function HandedMemory(desc) {
    if (handed && desc && desc.shared) {
      var fits = desc.initial <= handed.initial && desc.maximum <= handed.maximum;
      if (fits) madeMb = handed.initial / 16;
      S.log('Run: the VM ' + (fits ? 'takes' : 'does not take') + ' the memory made first (it asks ' +
            desc.initial + '/' + desc.maximum + ' pages, made ' + handed.initial + '/' + handed.maximum + ')' +
            (fits ? '' : ': a second memory'));
      var memory = handed.memory;
      handed = null;
      if (fits) return memory;
    }
    return new RealMemory(desc);
  }
  HandedMemory.prototype = RealMemory.prototype;
  WebAssembly.Memory = HandedMemory;
  function isOutOfMemory(text) {
    return /out of memory|\bOOM\b|Cannot enlarge memory|allocation failed/i.test(text) && !/out of bounds/i.test(text);
  }
  // The wasm memory could not grow (Emscripten's sbrk, malloc): a failure
  // soon after is most likely a program that went on without the memory
  // it asked for (a NULL written through: "corrupted its heap memory area
  // (address zero)", a heap check) -- out of memory, not a system failure.
  var heapFullAt = 0;
  function afterHeapFull(text) {
    if (!heapFullAt || performance.now() - heapFullAt > 60000) return false;
    S.log('Run: failed ' + Math.round((performance.now() - heapFullAt) / 1000) +
          ' s after the wasm memory could not grow: out of memory (' + text + ')');
    return true;
  }
  // The VM's initial memory and maximum (pages), from its script (in the
  // worker's cache): what Emscripten makes the memory with. (The script is
  // minified since 2026-10-20, tools/slim_thread_js.py: "INITIAL_MEMORY=N;"
  // and "maximum:N"; until 2026-10-22 these did not match, and the page
  // made no memory first: a start right after another app was refused.)
  function memoryOf(script) {
    return fetch(script).then(function (r) { return r.text(); }).then(function (js) {
      var initial = /INITIAL_MEMORY *= *(\d+);/.exec(js), maximum = /"?maximum"?: *(\d+)/.exec(js);
      return initial && maximum ? {initial: initial[1] / PAGE, maximum: +maximum[1]} : null;
    }).catch(function () { return null; });
  }
  // The ceiling: the VM's memory plan's (shim/membudget/mem_plan.js, as the
  // VM's mem_budget_pre.js will plan it: by the device's measured tab limit,
  // see "low memory", or ?mem=, ?memcap=); a phone whose plan is a guess
  // keeps 1536 MB (the VM then plans within it).
  function memPlan() {
    return ArcMemPlan({mem: params.get('mem'), memcap: params.get('memcap'),
                       limitMb: devLimit && devLimit.mb, threadMb: devLimit && devLimit.threadMb,
                       ios: ArcMemPlan.isIOS(navigator.userAgent, navigator.maxTouchPoints),
                       deviceMemory: navigator.deviceMemory});
  }
  function makeMemory(want, whole, done) {
    var plan = memPlan();
    whole = whole && plan.ios;
    var guessed = !devLimit && !params.get('mem') && !params.get('memcap');
    var ceiling = Math.min(want.maximum, (S.mobile && guessed ? Math.min(1536, plan.cap) : plan.cap) * 16);
    S.log('Run: memory plan (' + plan.why + '): budget ' + plan.budget + ' MB, wasm memory up to ' +
          Math.round(ceiling / 16) + ' MB');
    var caps = CAPS.slice(memTry - 1).map(function (c) { return c || ceiling; }).filter(function (c, i, all) {
      return c >= want.initial && c <= ceiling && all.indexOf(c) === i;
    });
    var t0 = Date.now(), n = 0;
    // ?memrefuse=S (tests on a Mac): refused for the first S seconds, as on an iPhone.
    var refuseUntil = t0 + 1000 * (+params.get('memrefuse') || 0);
    (function attempt() {
      for (var i = 0; i < caps.length; i++) {
        try {
          if (Date.now() < refuseUntil) throw new RangeError('Out of memory (memrefuse)');
          var initial = want.initial, memory = null;
          if (whole) {
            try { memory = new RealMemory({initial: caps[i], maximum: caps[i], shared: true}); initial = caps[i]; }
            catch (e) { S.log('Run: wasm memory of ' + Math.round(caps[i] / 16) + ' MB at once refused (' + e + ')'); }
          }
          if (!memory) memory = new RealMemory({initial: want.initial, maximum: caps[i], shared: true});
          if (n || i) S.log('Run: wasm memory ' + Math.round(caps[i] * PAGE / 1048576) + ' MB after ' +
                            Math.round((Date.now() - t0) / 1000) + ' s, ' + n + ' waits');
          if (initial > want.initial) S.log('Run: wasm memory made whole (' + Math.round(caps[i] / 16) +
                                            ' MB at once: an iPhone counts the pages grown into, not those made)');
          done({memory: memory, initial: initial, maximum: caps[i]});
          return;
        } catch (e) {}
      }
      var waited = Date.now() - t0;
      if (waited >= MEMORY_WAIT_MS) { done(null); return; }
      if (!n) S.log('Run: the device refuses ' + Math.round(want.initial * PAGE / 1048576) +
                    ' MB of wasm memory now (the previous app\'s memory not given back yet): waiting');
      n++;
      status('Освобождаю память после прошлого приложения…', null,

      // ?opfsfree=MB on this page (tests) over the measured budget; =0 is
      // none at all, =off no budget.
      var given = params.get('opfsfree');
      if (given !== 'off' && (given !== null ? /^-?\d+$/.test(given) : vmFree !== null)) {
        query.push('opfsfree=' + (given !== null ? given : Math.floor(vmFree / MB)));
        S.log('Run: storage budget of the VM ' + query[query.length - 1].slice(9) + ' MB');
      }
      query = query.join('&');
      s.src = system.script + (query ? '?' + query : '');
      s.onerror = function () { fail('Не удалось загрузить систему', 'Для первого запуска нужен интернет.'); };
      // The /system image (.data). By default a Blob, not an ArrayBuffer
      // (topic image-on-demand): the VM fills the pages it uses from it
      // with range requests to its blob: URL (posix_translation/
      // readonly_file.cc), so the image is neither in wasm memory whole nor
      // in the tab's JavaScript heap -- a Blob's bytes are the browser's
      // (WebKit's network process, Chrome's blob storage). The file
      // packager gets an empty package. ?image=copy: as before, the image in
      // one ArrayBuffer for the packager's loader (Module.getPreloadedPackage:
      // its own download keeps the chunks as well as their copy, 65 MB more
      // of the tab on an iPhone, docs/topics/ios-mem.md), copied whole into
      // wasm memory. The script asks for the image when it runs, so it
      // comes after it; the wasm compiles meanwhile.
      var image = null, asBlob = params.get('image') !== 'copy';
      var compiled = WebAssembly.compileStreaming(fetch(system.script.replace(/\.js$/, '.wasm')));
      compiled.catch(function () {});
      Module.getPreloadedPackage = function () { var b = image; image = null; return b; };
      Module.instantiateWasm = function (imports, done) {
        compiled.then(function (mod) {
          return WebAssembly.instantiate(mod, imports).then(function (inst) { done(inst, mod); });
        }).catch(function (e) { fail('Не удалось загрузить систему', String(e)); });
        return {};
      };
      // A piece of the body, once it is in the Blob, is let go of at once
      // (transfer, or a closed MessageChannel on iOS 16): left to the garbage
      // collector, the pieces of a body from the network stayed in "JS VM
      // Gigacage" (~100 MB on an iPhone X) at the first start of a new build.
      function drop(buf) {
        try {
          if (typeof buf.transfer == 'function') buf.transfer(0);
          else { var ch = new MessageChannel(); ch.port1.postMessage(buf, [buf]); ch.port1.close(); ch.port2.close(); }
        } catch (e) {}
      }
      // Read in pieces, saying how much of it is there: from the network the
      // first time, from the service worker's cache after that (a few
      // seconds). A Blob grows by 8 MB at a time (the pieces in between are
      // short-lived); an ArrayBuffer is one buffer of the image's size (no
      // second copy).
      fetch(system.script.replace(/\.js$/, '.data')).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var total = +r.headers.get('Content-Length') || 0;
        if (!r.body || !total) return asBlob ? r.blob() : r.arrayBuffer();
        var buf = asBlob ? null : new Uint8Array(total), blob = asBlob ? new Blob([]) : null;
        var parts = [], inParts = 0, got = 0, reader = r.body.getReader(), shownAt = 0;
        function show() {
          if (failed || bootStart) return;
          status('Загрузка ' + info.name + ' — ' + S.size(got) + ' из ' + S.size(total), got / total,
                 'Первый раз из сети, потом из памяти устройства.');
        }
        show();
        return (function pump() {
          return reader.read().then(function (c) {
            if (c.done) {
              show();
              if (asBlob) {
                blob = new Blob([blob].concat(parts));
                parts.forEach(function (p) { drop(p.buffer); });
                return blob;
              }
              return got === total ? buf.buffer : buf.slice(0, got).buffer;
            }
            if (asBlob) {
              parts.push(c.value);
              inParts += c.value.length;
              if (inParts >= 8 << 20) {
                blob = new Blob([blob].concat(parts));
                parts.forEach(function (p) { drop(p.buffer); });
                parts = []; inParts = 0;
              }
            } else {
              if (got + c.value.length > total) {  // longer than it said: grow once
                var bigger = new Uint8Array(Math.max(total * 2, got + c.value.length));
                bigger.set(buf.subarray(0, got));
                buf = bigger; total = bigger.length;
              }
              buf.set(c.value, got);
            }
            got += c.value.length;
            var now = performance.now();
            if (now - shownAt > 100) { shownAt = now; show(); }
            return pump();
          });
        })();
      }).then(function (b) {
        if (!asBlob) { image = b; return; }
        Module.arcImageSource = {url: URL.createObjectURL(b), size: b.size, blob: b};
        image = new ArrayBuffer(0);
        S.log('Run: the system image as a Blob (' + Math.round(b.size / 1048576) + ' MB), its pages read when first used');
      }, function (e) {
        S.log('Run: image download: ' + e + ' (the loader tries itself)');
      }).then(function () { document.body.appendChild(s); });
    }
  }

  function boot() {
    if (!window.isSecureContext) {
      fail('Нужно открыть по HTTPS', 'Страница открыта по ' + location.protocol + '.');
      return;
    }
    status('Подготовка…', null);
    var meta = null;
    SensesOrigins.config().then(function (cfg) {
      var O = SensesOrigins, given = params.get('home');
      if (given && O.trusted(O.originOf(given), cfg) && given !== O.library()) O.setHome(given);
      var kept = O.home();
      if (kept && kept !== O.library() && O.trusted(O.originOf(kept), cfg)) home = kept;
      if (home !== './') S.log('Run: on the app\'s own origin ' + location.host + ', library ' + home);
      if (!pkg) { replacePage(home); return new Promise(function () {}); }
      return SensesStore.init();
    }).then(function () { return SensesStore.get(pkg); }).catch(function () { return null; })
    .then(function (m) {
      meta = m;
      if (meta) SensesStore.readIcon(pkg).then(function (url) { if (url) $('icon').src = url; });
      return S.serviceWorker(function () { status('Обновление…', null); });
    }).then(function (controlled) {
      S.log('Run: controlled=' + controlled + ' isolated=' + window.crossOriginIsolated + ' standalone=' + S.standalone);
      if (!window.crossOriginIsolated) {
        if (controlled && !sessionStorage.getItem('senses-reloaded')) {
          sessionStorage.setItem('senses-reloaded', '1');
          reloadPage();
          return;
        }
        fail('Браузер не поддерживает нужные функции', 'Нужен Safari или Chrome свежей версии (SharedArrayBuffer).');
        return;
      }
      sessionStorage.removeItem('senses-reloaded');
      // (an app in the library without a system ran on 8.1, the default
      // before topic a10-default: it keeps 8.1 and its /data there)
      var stackId = params.get('stack') || params.get('appstack') || (meta && (meta.stack || 'a81')) || S.DEFAULT_STACK;
      if (!SYSTEMS[stackId]) stackId = S.DEFAULT_STACK;
      if (!meta && !params.get('stack')) {
        fail('Приложение не установлено', pkg + ' нет в библиотеке.');
        return;
      }
      checkStorage(stackId).then(function (ok) {
        if (ok) start(meta || {package: pkg, label: pkg}, stackId);
      });
    });
  }
  fit();
  boot();
})();
</script>
</body>
