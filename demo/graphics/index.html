<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>android.graphics on WebAssembly</title>
<style>
  :root { --bg: #0e1016; --fg: #d7dbe5; --muted: #8a90a0; --ok: #6fd28a; --bad: #ff7b72; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg: #f4f5f8; --fg: #1d2030; --muted: #5a6072; --ok: #1a7f37; --bad: #cf222e; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
               font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  header { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  canvas { display: block; width: 100%; max-width: 640px; aspect-ratio: 4 / 3;
           background: #000; border-radius: 6px; }
  pre { margin: 8px 0 0; font: 12px/1.45 ui-monospace, monospace;
        white-space: pre-wrap; word-break: break-word; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .log { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header id="cmd"></header>
  <!-- The display: FramebufferSurface's compositor thread takes it over as an
       OffscreenCanvas (shim/graphics/framebuffer_gralloc.cc). -->
  <canvas id="canvas" width="640" height="480"></canvas>
  <pre id="out"></pre>
</main>
<script src="report.js"></script>
<script>
  // Java program and arguments from the URL, as in dalvik-web:
  //   ?arg=-cp&arg=/system/framework/arc-tests.jar&arg=arcwasm.GraphicsTest
  var args = new URLSearchParams(location.search).getAll('arg');
  if (!args.length) args = ['-cp', '/system/framework/arc-tests.jar', 'arcwasm.GraphicsDemo'];
  document.getElementById('cmd').textContent = 'dalvikvm ' + args.join(' ');
  var outEl = document.getElementById('out');
  var started = performance.now();
  function emit(text) {
    var line = document.createElement('span');
    if (/^\[ OK \]|passed, 0 failed|-> OK$/.test(text)) line.className = 'ok';
    else if (/^\[FAIL\]|Exception|Error|Abort|-> FAIL$/.test(text)) line.className = 'bad';
    else if (/^[VDIWEF]\//.test(text)) line.className = 'log';
    line.textContent = text + '\n';
    outEl.appendChild(line);
    // Keep the page short while the demo reports its frame rate.
    while (outEl.childNodes.length > 60) outEl.removeChild(outEl.firstChild);
    arcReport(text);
  }
  // ?display=WxH: the display's size (default 640x480), e.g. a portrait one
  // for the activity tests' rotation checks (topic rotation).
  var size = /^(\d+)x(\d+)$/.exec(new URLSearchParams(location.search).get('display') || '');
  if (size) {
    var cv = document.getElementById('canvas');
    cv.width = +size[1];
    cv.height = +size[2];
    cv.style.aspectRatio = size[1] + ' / ' + size[2];
    cv.style.maxWidth = Math.min(640, +size[1]) + 'px';
  }
  // ?env=KEY=VALUE: the VM's environment (getenv), e.g. topic install8's
  // ARC_DATA_DIR / ARC_APPS_DIR.
  var env = new URLSearchParams(location.search).getAll('env');
  var Module = {
    arguments: args,
    canvas: document.getElementById('canvas'),
    print: emit,
    printErr: emit,
    preRun: [function () {
      env.forEach(function (e) { var i = e.indexOf('='); if (i > 0) ENV[e.slice(0, i)] = e.slice(i + 1); });
    }],
    onExit: function (code) {
      if (code === 75) {
        // The VM asks to be started again (as tools/run_java_tests.sh does
        // under Node): the same page, the same storage.
        emit('RESTART 75 after ' + Math.round(performance.now() - started) + ' ms');
        setTimeout(function () { location.reload(); }, 300);
        return;
      }
      emit('EXIT ' + code + ' after ' + Math.round(performance.now() - started) + ' ms');
      document.title = 'EXIT ' + code;
    },
    onAbort: function (what) { emit('ABORT ' + what); },
  };
</script>
<script src="dalvikvm.js"></script>
</body>
</html>
